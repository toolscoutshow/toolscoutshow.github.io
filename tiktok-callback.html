<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting… · Toolscout Studio</title>
<style>
  body { margin: 0; background: #0f1115; color: #e8eaed; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; text-align: center; }
  code { background: #1c1f24; padding: 4px 8px; border-radius: 6px; word-break: break-all; }
  a { color: #6bbf3b; }
</style>
</head>
<body>
<main>
  <h1>Connecting your account…</h1>
  <p id="msg">Sending the authorization to the app running on this computer.</p>
</main>
<script>
  // TikTok renvoie ici (adresse HTTPS publique) avec ?code=…&state=… ;
  // on transmet tel quel au petit serveur local qui attend sur ce PC.
  (function () {
    var q = window.location.search;
    var params = new URLSearchParams(q);
    var msg = document.getElementById('msg');
    if (params.get('error')) {
      msg.textContent = 'Authorization refused: ' + (params.get('error_description') || params.get('error'));
      return;
    }
    if (!params.get('code')) {
      msg.textContent = 'No authorization code received.';
      return;
    }
    window.location.replace('http://127.0.0.1:8895/tiktok/callback' + q);
  })();
</script>
</body>
</html>
